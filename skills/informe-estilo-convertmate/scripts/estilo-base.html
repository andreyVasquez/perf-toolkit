/* Identidad del documento: clonada de quotes.convertmate.co (repo quotes-convertmate).
   Recetas literales: fondo blanco, doc angosto max-w-3xl, Geist, barra h-1 con
   gradiente de marca, eyebrows uppercase tracking-wider brand-600, cards
   rounded-2xl border-neutral-100 bg-neutral-50/50, logos grayscale opacity-40.
   Escala de marca = verde ConvertMate (del blueprint). */
:root {
  --brand-50: #edfff6;
  --brand-100: #d5ffeb;
  --brand-200: #70ffbb;
  --brand-300: #2bfd97;
  --brand-400: #00e676;
  --brand: #00c05f;
  --brand-600: #00964d;
  --brand-700: #017a3d;
  --brand-800: #00753c;
  --brand-900: #00371d;

  --n-50: #fafafa;
  --n-100: #f5f5f5;
  --n-200: #e5e5e5;
  --n-300: #d4d4d4;
  --n-400: #a3a3a3;
  --n-500: #737373;
  --n-600: #525252;
  --n-900: #171717;

  --amber-50: #fffbeb;
  --amber-600: #d97706;
  --amber-800: #92400e;
  --red-600: #dc2626;
  --blue-700: #1d4ed8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-geist), -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #ffffff;
  color: var(--n-900);
  line-height: 1.6;
  font-size: 15px;
}

h1, h2, h3 {
  letter-spacing: -0.025em;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
  display: block;
}

button {
  font-family: inherit;
}

/* ---------- barra de gradiente de marca (receta quotes) ---------- */
.brand-bar {
  height: 4px;
  background: linear-gradient(90deg, var(--brand-600), var(--brand), var(--brand-400));
}

/* ---------- layout ---------- */
.doc-container {
  max-width: 768px;
  margin: 0 auto;
  padding: 0 24px;
}

.wide-container {
  max-width: 1024px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---------- header (receta quotes) ---------- */
.site-header {
  border-bottom: 1px solid var(--n-100);
  background: #ffffff;
}

.site-header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo-row img {
  height: 20px;
  width: auto;
}

.tagline-pill {
  display: inline-block;
  border: 1px solid var(--n-200);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--n-400);
}

/* ---------- eyebrows y pills ---------- */
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand-600);
}

.hero-pill {
  display: inline-block;
  border-radius: 999px;
  background: var(--brand-50);
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand-800);
}

.pill-neutral {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  background: var(--n-100);
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--n-600);
  white-space: nowrap;
}

.pill-ok {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  background: var(--brand-50);
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--brand-800);
  white-space: nowrap;
}

.pill-warn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  background: var(--amber-50);
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--amber-800);
  white-space: nowrap;
}

/* Pastilla que lleva una frase entera y no una etiqueta de dos palabras (el alcance
   de una dirección de trabajo, o cuánto hay en juego en ella). Las pastillas normales
   son "nowrap" a propósito: una etiqueta partida en dos renglones no se lee. Pero con
   una frase adentro, ese nowrap estiraba la tarjeta contenedora hasta 1.805px dentro
   de un documento de 720px. Acá el texto puede partirse, y el radio baja porque un
   óvalo de dos renglones se ve roto. Va después de las tres pastillas para ganarles
   el white-space por orden de aparición. */
.pill-larga {
  display: inline-flex;
  align-items: flex-start;
  max-width: 100%;
  min-width: 0;
  border-radius: 12px;
  padding: 6px 12px;
  white-space: normal;
  text-align: left;
  line-height: 1.5;
  overflow-wrap: break-word;
}

/* banner de documento original (rondas importadas) */
.source-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 28px;
  padding: 16px 18px;
  border: 1px solid var(--n-200);
  border-radius: 14px;
  background: var(--n-50);
  transition: border-color 0.15s ease, background 0.15s ease;
}

.source-banner:hover {
  border-color: var(--brand-300);
  background: rgba(237, 255, 246, 0.4);
}

.source-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 10px;
  background: var(--n-900);
  color: #fff;
  font-weight: 700;
  font-size: 17px;
}

.source-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1 1;
  min-width: 0;
}

.source-text strong {
  font-size: 14.5px;
  color: var(--n-900);
}

.source-text span {
  font-size: 13px;
  color: var(--n-500);
  line-height: 1.5;
}

.source-cta {
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--brand-700);
  white-space: nowrap;
}

.pill-video {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  background: var(--n-900);
  color: #ffffff;
  padding: 4px 13px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  text-decoration: none;
}

.pill-video:hover {
  background: #262626;
}

/* ---------- hero del documento ---------- */
.doc-hero {
  padding: 80px 0 56px;
}

.doc-hero h1 {
  margin-top: 20px;
  font-size: 40px;
  font-weight: 600;
  line-height: 1.1;
  color: var(--n-900);
  text-wrap: pretty;
}

.doc-hero .subline {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 14px;
  color: var(--n-500);
}

.doc-hero .subline strong {
  color: var(--n-900);
  font-weight: 600;
}

/* ---------- secciones ---------- */
.doc-section {
  padding: 40px 0 8px;
}

.doc-section .section-title {
  margin-top: 6px;
  font-size: 20px;
  font-weight: 600;
  color: var(--n-900);
}

.doc-section .section-desc {
  margin-top: 8px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--n-600);
}

.soft-card {
  border: 1px solid var(--n-100);
  background: rgba(250, 250, 250, 0.5);
  border-radius: 16px;
  padding: 20px;
}

.brand-card {
  border: 1px solid var(--brand-100);
  background: rgba(237, 255, 246, 0.5);
  border-radius: 16px;
  padding: 20px;
}

.fuentes-grid {
  display: grid;
  grid-gap: 16px;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  margin-top: 24px;
}

.fuente-name {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand-600);
}

.fuente-desc {
  margin-top: 6px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--n-600);
}

/* Prosa larga que el generador escribe en párrafos. Sin esto los saltos se colapsan y
   un texto pensado como "son tres señales: la primera... la segunda..." llega al cliente
   como un muro. `pre-line` respeta el salto y colapsa los espacios, así que en un campo
   sin saltos no cambia nada. */
.prosa-larga {
  white-space: pre-line;
}

/* ---------- hipótesis ---------- */
.hyp {
  margin-top: 32px;
  border: 1px solid var(--n-100);
  border-radius: 16px;
  overflow: hidden;
  background: #ffffff;
}

.hyp-head {
  padding: 24px 24px 0;
}

.hyp-head .hyp-id {
  display: inline-block;
  border-radius: 999px;
  background: var(--brand-50);
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand-800);
}

.hyp-head h3 {
  margin-top: 14px;
  font-size: 21px;
  font-weight: 600;
  color: var(--n-900);
}

.hyp-head .hyp-loc {
  margin-top: 6px;
  font-size: 13px;
  color: var(--n-500);
}

.hyp-body {
  padding: 20px 24px 24px;
}

/* formato Si/Entonces/Porque — timeline con línea de marca (receta quotes) */
.stmt {
  position: relative;
  margin-top: 8px;
  display: grid;
  grid-gap: 18px;
  gap: 18px;
}

.stmt::before {
  content: "";
  position: absolute;
  left: 19px;
  top: 20px;
  bottom: 20px;
  width: 1px;
  background: var(--brand-200);
}

.stmt-row {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 18px;
}

.stmt-row .stmt-icon {
  position: relative;
  z-index: 1;
  display: flex;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: var(--brand-100);
  color: var(--brand-800);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.stmt-row .stmt-text {
  padding-top: 2px;
}

.stmt-row .stmt-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand-600);
}

.stmt-row .stmt-value {
  margin-top: 4px;
  font-size: 15px;
  line-height: 1.65;
  color: var(--n-900);
  /* Misma razón que .ab-text: la propuesta se escribe con lista numerada y sin esto
     el navegador la junta en un párrafo corrido. */
  white-space: pre-line;
}

/* información general (formato Notion) */
.info-table {
  margin-top: 14px;
  width: 100%;
  max-width: 560px;
  border-collapse: collapse;
  font-size: 14.5px;
}

.info-table td {
  border: 1px solid var(--n-100);
  padding: 10px 16px;
}

.info-table td:first-child {
  font-weight: 600;
  width: 160px;
  background: rgba(250, 250, 250, 0.6);
}

/* código oficial de la hipótesis */
.hyp-codigo {
  display: inline-block;
  margin-left: 8px;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 11.5px;
  color: var(--n-500);
  background: var(--n-100);
  border-radius: 6px;
  padding: 3px 8px;
}

/* Versión A (actual) vs Versión B (propuesta) */
.ab-grid {
  display: grid;
  grid-gap: 16px;
  gap: 16px;
  margin-bottom: 22px;
  align-items: start;
}

@media (min-width: 640px) {
  .ab-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.ab-col {
  border: 1px solid var(--n-100);
  background: rgba(250, 250, 250, 0.5);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.ab-col.b {
  border-color: var(--brand-100);
  background: rgba(237, 255, 246, 0.4);
}

.ab-label {
  padding: 14px 18px 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--n-500);
}

.ab-label.b {
  color: var(--brand-600);
}

/* la captura del estado actual va en un marco de alto acotado con scroll-into-view;
   evita que un screenshot de página completa estire la columna. */
.ab-img-frame {
  margin: 0 18px;
  max-height: 340px;
  overflow: hidden;
  border: 1px solid var(--n-200);
  border-radius: 10px;
  background: var(--n-100);
  position: relative;
}

.ab-img-frame::after {
  content: "Ampliar ↗";
  position: absolute;
  right: 8px;
  bottom: 8px;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 6px;
  padding: 2px 7px;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.ab-img-frame:hover::after {
  opacity: 1;
}

.ab-img {
  width: 100%;
  display: block;
  object-fit: cover;
  object-position: top;
}

.ab-text {
  padding: 12px 18px 16px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--n-900);
  /* El estado actual y la propuesta se escriben con listas numeradas separadas por
     renglones en blanco. Sin esto el navegador las junta en un solo párrafo y el
     cliente lee "1. ... 2. ... 3. ..." de corrido, que es justo lo que la lista
     evitaba. Lo detectó la auditoría de la ronda 2 de Manze el 28-ago-2026. */
  white-space: pre-line;
}

/* evidencia */
.evidence-title {
  margin: 28px 0 4px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--n-500);
}

.evidence-grid {
  display: grid;
  grid-gap: 16px;
  gap: 16px;
  margin-top: 12px;
}

@media (min-width: 640px) {
  .evidence-grid.two {
    grid-template-columns: 1fr 1fr;
  }
}

.ev-card {
  border: 1px solid var(--n-100);
  background: rgba(250, 250, 250, 0.5);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.ev-card.zig {
  border-color: var(--brand-100);
  background: rgba(237, 255, 246, 0.4);
}

.ev-img-wrap {
  display: block;
  background: var(--n-100);
  border-bottom: 1px solid var(--n-100);
  max-height: 420px;
  overflow: hidden;
  position: relative;
}

.ev-img-wrap::after {
  content: "Ampliar ↗";
  position: absolute;
  right: 8px;
  bottom: 8px;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 6px;
  padding: 2px 7px;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.ev-img-wrap:hover::after {
  opacity: 1;
}

.ev-card img {
  width: 100%;
  display: block;
  object-fit: cover;
  object-position: top;
}

.ev-pad {
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1 1;
}

.ev-source {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand-600);
}

.ev-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--n-900);
}

.ev-quote {
  margin-top: 4px;
  border-left: 2px solid var(--brand-400);
  padding: 2px 0 2px 12px;
  font-size: 14px;
  font-style: italic;
  line-height: 1.6;
  color: var(--n-900);
}

.ev-stat {
  align-self: stretch;
  margin-top: 6px;
  border-radius: 10px;
  background: var(--n-50);
  border: 1px solid var(--n-100);
  border-left: 3px solid var(--brand-400);
  color: var(--n-900);
  padding: 10px 13px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.55;
}

/* números destacados dentro del bloque de dato */
.ev-stat b,
.ev-stat strong {
  color: var(--brand-700);
}

.ev-insight {
  font-size: 13px;
  line-height: 1.6;
  color: var(--n-600);
}

/* priorización */
.hyp-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
}

.ice-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--n-600);
}

.ice-bar strong {
  color: var(--n-900);
}

.ice-track {
  flex: 1 1;
  max-width: 240px;
  height: 5px;
  border-radius: 999px;
  background: var(--n-100);
  overflow: hidden;
}

.ice-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-400), var(--brand-600));
}

/* ---------- franja de autoridad (logos, receta quotes) ---------- */
.logos-section {
  padding: 48px 0;
}

.logos-label {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--n-300);
}

.logos-row {
  margin-top: 32px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  column-gap: 40px;
  row-gap: 24px;
  opacity: 0.4;
}

/* receta quotes: brightness-0 pinta cualquier logo (incluso blanco) de negro */
.logos-row img {
  filter: brightness(0);
}

.logos-row .logo-word {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.02em;
  color: var(--n-900);
  text-transform: uppercase;
}

/* ---------- footer ---------- */
.doc-footer {
  border-top: 1px solid var(--n-100);
  margin-top: 32px;
  padding: 32px 0 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--n-500);
}

/* ---------- banners ---------- */
.banner-amber {
  margin-top: 32px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-radius: 12px;
  background: var(--amber-50);
  padding: 16px 20px;
  font-size: 14px;
  color: var(--amber-800);
}

/* =========================================================
   Interno (dashboard + wizard) — misma familia visual
   ========================================================= */
.page-head {
  padding: 48px 0 8px;
}

.page-head h1 {
  font-size: 28px;
  font-weight: 600;
}

.page-head p {
  color: var(--n-600);
  margin-top: 8px;
  max-width: 620px;
  font-size: 14.5px;
}

.brand-group {
  margin-top: 32px;
}

.brand-group > h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--n-400);
  font-weight: 600;
  margin-bottom: 12px;
}

.round-card {
  border: 1px solid var(--n-100);
  background: rgba(250, 250, 250, 0.5);
  border-radius: 16px;
  padding: 20px 24px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}

.round-card .meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.round-card .meta .title {
  font-weight: 600;
}

.round-card .meta .sub {
  font-size: 13px;
  color: var(--n-500);
}

.round-card .actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 500;
  padding: 9px 16px;
  border-radius: 10px;
  border: 1px solid var(--n-200);
  background: #ffffff;
  color: var(--n-900);
  cursor: pointer;
  transition: background 0.15s ease;
}

.btn:hover {
  background: var(--n-50);
}

.btn-primary {
  background: var(--n-900);
  border-color: var(--n-900);
  color: #ffffff;
}

.btn-primary:hover {
  background: #262626;
}

.btn-brand {
  background: var(--brand-600);
  border-color: var(--brand-600);
  color: #ffffff;
}

.btn-brand:hover {
  background: var(--brand-700);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.empty-note {
  border: 1px dashed var(--n-200);
  border-radius: 16px;
  padding: 28px;
  color: var(--n-600);
  font-size: 14px;
}

/* wizard */
.wizard {
  margin: 32px 0 96px;
  max-width: 640px;
}

.wizard-steps {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 28px;
}

.wstep {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--n-400);
}

.wstep .dot {
  display: flex;
  width: 26px;
  height: 26px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--n-100);
  color: var(--n-500);
  font-size: 12px;
}

.wstep.active .dot {
  background: var(--n-900);
  color: #ffffff;
}

.wstep.done .dot {
  background: var(--brand-100);
  color: var(--brand-800);
}

.wstep-line {
  flex: 1 1;
  height: 1px;
  background: var(--n-200);
}

.wizard-card {
  border: 1px solid var(--n-100);
  background: #ffffff;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 4px 16px rgba(0, 0, 0, 0.04);
}

.wizard-card h2 {
  font-size: 19px;
  font-weight: 600;
}

.wizard-card .wdesc {
  margin-top: 6px;
  font-size: 14px;
  color: var(--n-600);
}

.option-grid {
  display: grid;
  grid-gap: 10px;
  gap: 10px;
  margin-top: 20px;
}

@media (min-width: 560px) {
  .option-grid.cols {
    grid-template-columns: 1fr 1fr;
  }
}

.option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 1px solid var(--n-200);
  border-radius: 12px;
  background: #ffffff;
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  font-size: 14.5px;
  font-weight: 500;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.option:hover {
  background: var(--n-50);
}

.option.selected {
  border-color: var(--brand-600);
  background: rgba(237, 255, 246, 0.5);
}

/* Una opción bloqueada tiene que VERSE bloqueada. El tipo de documento queda fijo
   cuando se rehace una ronda (lo decide el documento que se reemplaza), y un botón
   que no responde sin decir por qué se lee como un fallo de la app. */
.option:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.option .opt-sub {
  display: block;
  margin-top: 2px;
  font-size: 12.5px;
  font-weight: 400;
  color: var(--n-500);
}

.check-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 1px solid var(--n-100);
  background: rgba(250, 250, 250, 0.5);
  border-radius: 12px;
  padding: 16px 18px;
  margin-top: 16px;
  font-size: 14.5px;
}

.wizard-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 24px;
}

.date-range-row {
  display: flex;
  align-items: flex-end;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.date-range-row label {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.date-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--n-500);
}

.date-input {
  font-family: inherit;
  font-size: 14.5px;
  color: var(--n-900);
  border: 1px solid var(--n-200);
  border-radius: 10px;
  background: #ffffff;
  padding: 9px 12px;
}

.date-input:focus {
  outline: 2px solid var(--brand-300);
  outline-offset: 1px;
}

.date-arrow {
  padding-bottom: 11px;
  color: var(--n-400);
}

/* ---------- playbook de diseño ---------- */
.resumen-pb {
  margin-top: 12px;
  border: 1px solid var(--brand-100);
  background: rgba(237, 255, 246, 0.4);
  border-radius: 16px;
  padding: 18px 20px;
  font-size: 15px;
  line-height: 1.65;
  color: var(--n-900);
}

.pb-card {
  margin-top: 18px;
  border: 1px solid var(--n-100);
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
}

.pb-card.win {
  border-left: 3px solid var(--brand-400);
}

.pb-card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 22px 0;
}

.pb-num {
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--brand-700);
}

.pb-card-head h3 {
  font-size: 18px;
  font-weight: 600;
  color: var(--n-900);
}

.pb-apply {
  padding: 12px 22px 4px;
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--n-900);
}

.pb-evidence {
  padding: 8px 22px 18px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--n-600);
}

.pb-label {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--n-400);
  margin-bottom: 3px;
}

.pb-label.ok {
  color: var(--brand-600);
}

.pb-label.warn {
  color: var(--amber-600);
}

.pb-origin {
  display: inline-block;
  margin-left: 8px;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 11px;
  color: var(--n-400);
  background: var(--n-100);
  border-radius: 6px;
  padding: 1px 7px;
}

.pb-discard {
  margin-top: 12px;
  border: 1px solid var(--n-100);
  border-left: 3px solid var(--amber-600);
  background: rgba(255, 251, 235, 0.5);
  border-radius: 12px;
  padding: 14px 18px;
}

.pb-voice-grid {
  display: grid;
  grid-gap: 16px;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  margin-top: 16px;
}

.pb-list {
  margin: 10px 0 0 18px;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--n-700, var(--n-600));
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.pb-cols {
  display: grid;
  grid-gap: 20px;
  gap: 20px;
  padding: 12px 22px 20px;
}

@media (min-width: 560px) {
  .pb-cols {
    grid-template-columns: 1fr 1fr;
  }
}

.round-check {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--n-700, var(--n-600));
  padding: 8px 12px;
  border: 1px solid var(--n-100);
  border-radius: 10px;
  margin-bottom: 6px;
  cursor: pointer;
}

.round-check input {
  accent-color: var(--brand-600);
  width: 15px;
  height: 15px;
}

/* control segmentado (modo de fuente cualitativa) */
.seg-control {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  background: var(--n-100);
  border-radius: 12px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.seg {
  border: none;
  background: transparent;
  color: var(--n-600);
  font-size: 13.5px;
  font-weight: 500;
  padding: 7px 16px;
  border-radius: 9px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.seg:hover {
  color: var(--n-900);
}

.seg.active {
  background: #ffffff;
  color: var(--n-900);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

/* dropzone drag & drop */
.dropzone {
  border: 1.5px dashed var(--n-300);
  border-radius: 14px;
  background: var(--n-50);
  padding: 32px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.dropzone:hover {
  border-color: var(--brand-400);
}

.dropzone.drag {
  border-color: var(--brand-600);
  background: rgba(237, 255, 246, 0.6);
}

.dropzone.ok {
  border-style: solid;
  border-color: var(--brand-200);
  background: rgba(237, 255, 246, 0.4);
}

.filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.filter-check {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13.5px;
  color: var(--n-600);
  cursor: pointer;
  white-space: nowrap;
}

.filter-check input {
  accent-color: var(--brand-600);
  width: 15px;
  height: 15px;
}

.select-input {
  width: 100%;
  margin-top: 14px;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--n-900);
  border: 1px solid var(--n-200);
  border-radius: 10px;
  background: #ffffff;
  padding: 10px 12px;
}

.select-input:focus {
  outline: 2px solid var(--brand-300);
  outline-offset: 1px;
}

.num-input {
  width: 84px;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--n-900);
  border: 1px solid var(--n-200);
  border-radius: 10px;
  background: #ffffff;
  padding: 8px 10px;
}

.num-input:focus {
  outline: 2px solid var(--brand-300);
  outline-offset: 1px;
}

.prio-textarea {
  width: 100%;
  margin-top: 18px;
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--n-900);
  border: 1px solid var(--n-200);
  border-radius: 12px;
  background: #ffffff;
  padding: 14px 16px;
  resize: vertical;
}

.prio-textarea:focus {
  outline: 2px solid var(--brand-300);
  outline-offset: 1px;
}

.legend-note {
  margin-top: 16px;
  border: 1px solid var(--n-100);
  border-left: 2px solid var(--brand-300);
  background: rgba(250, 250, 250, 0.6);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--n-500);
}

.legend-note strong {
  color: var(--n-600);
}

.order-box {
  margin-top: 20px;
  border: 1px solid var(--n-200);
  border-radius: 12px;
  background: var(--n-50);
  padding: 16px 18px;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 13px;
  line-height: 1.7;
  color: var(--n-900);
  white-space: pre-wrap;
}

/* =========================================================
   Hub shell: sidebar izquierda + contenido
   ========================================================= */
.hub-shell {
  display: flex;
  min-height: 100dvh;
  background: #ffffff;
}

.sidebar {
  width: 248px;
  flex-shrink: 0;
  border-right: 1px solid var(--n-100);
  background: rgba(250, 250, 250, 0.6);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  position: -webkit-sticky;
  position: sticky;
  top: 0;
  height: 100dvh;
  overflow-y: auto;
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px;
}

.sidebar-logo img {
  height: 18px;
  width: auto;
}

.sidebar-nav {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  flex: 1 1;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-section {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--n-400);
  padding: 0 8px;
  margin-bottom: 6px;
}

.navlink {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--n-600);
  transition: background 0.15s ease, color 0.15s ease;
}

.navlink:hover {
  background: var(--n-100);
  color: var(--n-900);
}

.navlink.active {
  background: var(--brand-50);
  color: var(--brand-800);
  font-weight: 600;
}

.nav-badge {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--n-400);
  border: 1px solid var(--n-200);
  border-radius: 6px;
  padding: 1px 6px;
}

.sidebar-foot {
  border-top: 1px solid var(--n-100);
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.foot-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--n-600);
  padding: 0 8px;
}

.foot-row .ok {
  color: var(--brand-600);
  font-weight: 700;
}

.foot-row .pend {
  color: var(--amber-600);
  font-size: 11px;
  font-weight: 600;
}

.hub-main {
  flex: 1 1;
  min-width: 0;
}

.hub-content {
  max-width: 1024px;
  margin: 0 auto;
  padding: 0 32px;
}

/* tabla de conexiones */
.conn-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.conn-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--n-400);
  padding: 10px 14px;
  border-bottom: 1px solid var(--n-200);
}

.conn-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--n-100);
  white-space: nowrap;
}

@media (max-width: 860px) {
  .hub-shell {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    height: auto;
    position: static;
    flex-direction: row;
    align-items: center;
    gap: 16px;
    overflow-x: auto;
    padding: 12px 16px;
  }
  .sidebar-nav {
    margin-top: 0;
    flex-direction: row;
    gap: 16px;
  }
  .nav-group {
    flex-direction: row;
    align-items: center;
    gap: 4px;
  }
  .nav-section,
  .sidebar-foot,
  .nav-badge {
    display: none;
  }
  .navlink {
    white-space: nowrap;
  }
  .hub-content {
    padding: 0 20px;
  }
}

/* ---------- print ---------- */
@media print {
  .no-print {
    display: none !important;
  }
  .hyp,
  .soft-card,
  .ev-card {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .doc-hero {
    padding: 24px 0;
  }
}

@media (max-width: 640px) {
  .doc-hero {
    padding: 56px 0 40px;
  }
  .doc-hero h1 {
    font-size: 30px;
  }
  .round-card {
    flex-direction: column;
    align-items: flex-start;
  }
}

/* ── Resultados de la ronda ──────────────────────────────────────────────
   Solo se pintan para los tests que corrieron y recibieron datos. El bloque
   vive DENTRO de la hipótesis, debajo de la propuesta, porque el cliente lee
   "esto propusimos → esto pasó" en un solo movimiento. */

.res-block {
  margin-top: 22px;
  border: 1px solid var(--n-200);
  border-radius: 14px;
  overflow: hidden;
  background: #ffffff;
}

.res-block.res-ok {
  border-color: var(--brand-200);
}

.res-block.res-warn {
  border-color: #fcd34d;
}

.res-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--n-100);
  background: var(--n-50);
}

.res-block.res-ok .res-head {
  background: rgba(237, 255, 246, 0.6);
}

.res-block.res-warn .res-head {
  background: var(--amber-50);
}

.res-veredicto {
  font-size: 14px;
  font-weight: 600;
  color: var(--n-900);
}

.res-block.res-ok .res-veredicto {
  color: var(--brand-800);
}

.res-block.res-warn .res-veredicto {
  color: var(--amber-800);
}

.res-periodo {
  margin-left: auto;
  font-size: 12px;
  color: var(--n-500);
}

.res-metrics {
  display: grid;
  grid-gap: 1px;
  gap: 1px;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  background: var(--n-100);
  border-bottom: 1px solid var(--n-100);
}

.res-metric {
  background: #ffffff;
  padding: 14px 16px;
}

.res-metric .res-k {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--n-500);
}

.res-metric .res-v {
  display: block;
  margin-top: 5px;
  font-size: 17px;
  font-weight: 600;
  color: var(--n-900);
  font-feature-settings: "tnum";
  font-variant-numeric: tabular-nums;
}

.res-metric .res-v.pos {
  color: var(--brand-700);
}

.res-metric .res-v.neg {
  color: var(--n-600);
}

.res-body {
  padding: 16px 18px 18px;
}

.res-detalle {
  font-size: 14px;
  line-height: 1.65;
  color: var(--n-600);
}

.res-learn {
  margin-top: 14px;
  border-left: 3px solid var(--brand);
  background: var(--brand-50);
  border-radius: 0 10px 10px 0;
  padding: 12px 16px;
}

.res-learn .res-learn-k {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand-800);
}

.res-learn .res-learn-v {
  display: block;
  margin-top: 5px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--n-900);
}

/* Tabla de cierre: el impacto primero, antes de cualquier detalle. */
.res-tabla {
  width: 100%;
  margin-top: 18px;
  border-collapse: collapse;
  font-size: 14px;
}

.res-tabla th {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--n-200);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--n-500);
}

.res-tabla td {
  padding: 12px;
  border-bottom: 1px solid var(--n-100);
  color: var(--n-600);
  vertical-align: top;
}

.res-tabla td:first-child {
  color: var(--n-900);
  font-weight: 500;
}

.res-tabla td.num {
  font-feature-settings: "tnum";
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

@media (max-width: 640px) {
  .res-periodo {
    margin-left: 0;
    width: 100%;
  }
  .res-tabla {
    display: block;
    overflow-x: auto;
  }
}

/* Lista "Qué sigue" del análisis de resultados: pasos numerados, no viñetas
   sueltas, porque el orden es la recomendación. */
.lista-sigue {
  counter-reset: paso;
  list-style: none;
  margin-top: 18px;
  display: grid;
  grid-gap: 12px;
  gap: 12px;
}

.lista-sigue li {
  counter-increment: paso;
  position: relative;
  padding: 16px 18px 16px 54px;
  border: 1px solid var(--n-100);
  border-radius: 12px;
  background: rgba(250, 250, 250, 0.5);
  font-size: 14px;
  line-height: 1.65;
  color: var(--n-600);
}

.lista-sigue li::before {
  content: counter(paso);
  position: absolute;
  left: 18px;
  top: 16px;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--brand-50);
  color: var(--brand-800);
  font-size: 12px;
  font-weight: 600;
}

/* La voz de la compradora dentro de un resultado. Va en cursiva y entre comillas
   porque es habla literal: si se pudiera confundir con redacción nuestra, alguien
   la va a "mejorar" y deja de ser una cita. */
.voz-cliente {
  margin-top: 16px;
  border-left: 3px solid var(--n-300);
  padding: 4px 0 4px 16px;
}

.voz-cliente .voz-k {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--n-500);
}

.voz-cliente .voz-cita {
  margin-top: 10px;
  font-size: 15px;
  line-height: 1.6;
  font-style: italic;
  color: var(--n-900);
}

.voz-cliente .voz-base {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--n-500);
}

/* El nombre del experimento tal cual está en la herramienta, dentro de la tabla.
   Existe para que verificar una cifra sea abrir la herramienta y buscar ese nombre;
   por eso va en monoespaciado y en gris: es una referencia, no un título. */
.td-codigo {
  display: block;
  margin-top: 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--n-400);
  word-break: break-word;
}

/* La acción fuera de la tienda se distingue del aprendizaje: uno alimenta la
   próxima ronda de tests, el otro se puede usar mañana en un anuncio. */
.res-learn.accion {
  border-left-color: var(--n-400);
  background: var(--n-50);
}

.res-learn.accion .res-learn-k {
  color: var(--n-600);
}

/* La nota de atribución va pegada a la tabla de impacto porque es lo que sostiene
   esas cifras: sin ella el cliente no sabe si ganó por el cambio o por el mes. */
.atribucion {
  margin-top: 22px;
}

.atribucion p {
  margin-top: 10px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--n-700, var(--n-600));
}

/* La tabla de impacto en papel. En pantalla el contenedor es angosto y las columnas
   se parten palabra por palabra; impreso hay ancho de sobra y no hay razón para que
   "Todas las fichas que usan la plantilla de colágeno" ocupe nueve renglones. */
@media print {
  .res-tabla {
    font-size: 12px;
    table-layout: fixed;
  }
  .res-tabla th,
  .res-tabla td {
    padding: 9px 8px;
  }
  .res-tabla th:nth-child(1), .res-tabla td:nth-child(1) { width: 26%; }
  .res-tabla th:nth-child(2), .res-tabla td:nth-child(2) { width: 19%; }
  .res-tabla th:nth-child(3), .res-tabla td:nth-child(3) { width: 10%; }
  .res-tabla th:nth-child(4), .res-tabla td:nth-child(4) { width: 13%; }
  .res-tabla th:nth-child(5), .res-tabla td:nth-child(5) { width: 18%; }
  .res-tabla th:nth-child(6), .res-tabla td:nth-child(6) { width: 15%; }
  .td-codigo {
    font-size: 9px;
  }
  /* Un test no se parte entre dos páginas: se lee entero o no se lee. */
  .hyp,
  .res-block {
    page-break-inside: avoid;
    break-inside: avoid;
  }
}

/* La tabla del tamaño de la oportunidad, en la auditoría de conversión.
 *
 * Tenía dos defectos, y los dos salen de dejar que el navegador reparta el ancho solo:
 * la tabla se salía del documento (865px medidos dentro de una columna de 720, y hasta
 * 2.574px en la auditoría de IOX H2), y repartía el espacio al revés de lo que pesa cada
 * columna, porque "Orden de magnitud" es .num y .num es nowrap: una columna de 44
 * caracteres de mediana se llevaba 573px y "Supuesto", con 264 de media, se quedaba con
 * 99px y caía en veintitantos renglones.
 *
 * El reparto de abajo sale de contar el contenido real de los 43 escenarios publicados
 * en las auditorías de agosto: Frente 177 caracteres de media contando sus dos
 * sublíneas (que van en cuerpo más chico), Sobre quiénes se mide 108, Supuesto 264,
 * Orden de magnitud 77 de media y 44 de mediana. La última columna queda por encima de
 * su peso a propósito: lleva la cifra, y una cifra partida en tres renglones no se lee.
 *
 * Va DESPUÉS del bloque @media print de arriba a propósito: ese bloque fija anchos
 * pensados para la tabla de seis columnas del análisis de resultados, y esta tiene
 * cuatro. Misma especificidad, gana el orden de aparición, en pantalla y en papel. */
.tabla-oportunidad {
  table-layout: fixed;
}

.tabla-oportunidad th,
.tabla-oportunidad td {
  overflow-wrap: break-word;
}

/* En la auditoría, varias columnas ".num" no llevan una cifra sino una frase con una
   cifra adentro: "Diciembre de 2025, siete meses después de abrir" en la tabla de
   indicadores de Labif US, o el orden de magnitud de cada frente. El nowrap de .num
   las estiraba y con ellas la tabla entera (1.178px en Labif US, 1.113px en Nutriplus,
   sobre 720 de documento). Acá pueden partirse, y conservan los números tabulares. Una
   cifra sola no tiene espacios: sigue sin partirse. Solo aplica a la auditoría; el
   análisis de resultados sí mete cifras sueltas en esas celdas. */
.doc-auditoria .res-tabla td.num {
  white-space: normal;
}

.tabla-oportunidad th:nth-child(1), .tabla-oportunidad td:nth-child(1) { width: 26%; }
.tabla-oportunidad th:nth-child(2), .tabla-oportunidad td:nth-child(2) { width: 18%; }
.tabla-oportunidad th:nth-child(3), .tabla-oportunidad td:nth-child(3) { width: 36%; }
.tabla-oportunidad th:nth-child(4), .tabla-oportunidad td:nth-child(4) { width: 20%; }

/* El botón que saca un análisis de la app. Rojo solo en el segundo paso, cuando ya
   está preguntando: en reposo es un botón más y no invita a tocarlo. */
.btn-peligro {
  border-color: #fca5a5;
  background: #fef2f2;
  color: var(--red-600);
  font-weight: 600;
}

.btn-peligro:hover {
  background: #fee2e2;
}

/* Cuándo se generó el documento. Va en la fila de acciones y en gris: es un dato
   de orientación, no una etiqueta de estado, y compite con "Analizada" si grita. */
/* Tipo de documento en la lista de rondas. Una ronda de optimización y una de
   hipótesis se leen distinto (una se implementa, la otra se testea), así que la
   lista tiene que decir cuál es antes de abrirla. */
.pill-tipo {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  border: 1px solid var(--n-200);
  background: var(--n-50);
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--n-700);
  white-space: nowrap;
}

.pill-tipo.optim {
  border-color: rgba(0, 192, 95, 0.35);
  background: rgba(0, 192, 95, 0.08);
  color: var(--brand-700, #067a41);
}

.pill-fecha {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  background: transparent;
  border: 1px solid var(--n-200);
  padding: 4px 12px;
  font-size: 12px;
  color: var(--n-500);
  white-space: nowrap;
  font-feature-settings: "tnum";
  font-variant-numeric: tabular-nums;
}

/* Un nombre de experimento que además es un botón. Parece texto hasta que se pasa
   por encima: sacar un experimento del análisis es una decisión, no un clic de paso. */
.btn-enlace {
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  border-bottom: 1px dashed var(--n-300);
}

.btn-enlace:hover {
  color: var(--brand-800);
  border-bottom-color: var(--brand);
}

/* ═══════════════════════════════════════════════════════════════════════════
   LA AUDITORÍA EN UN TELÉFONO
   ═══════════════════════════════════════════════════════════════════════════

   POR QUÉ EXISTE. El COO abrió /aud/caseteja-auditoria-202608 a 400px y el
   documento salía como la versión de escritorio encogida: tablas aplastadas en
   columnas de dos o tres palabras por línea, gráficos con las etiquetas del eje
   a 4,9px, y tarjetas en un hilo vertical. Sus palabras: "en mobile se ven
   bastante extrañas".

   Una revisión anterior había dado por bueno el responsive porque comprobó que
   NO HUBIERA DESPLAZAMIENTO LATERAL de la página. Ese chequeo pasaba, y el
   documento seguía sin leerse: no hay scroll lateral precisamente PORQUE el
   navegador aplasta cada columna hasta su ancho mínimo para que quepa. La
   ausencia de desborde es el síntoma del problema, no la prueba de que no lo
   hay. El piso es que la página no se mueva de lado; la meta es que el texto,
   las tablas y los gráficos se lean sin acercar.

   Se comprueba con `node scripts/probar-movil.mjs`, que mide a 360, 390 y 430px
   sobre documentos reales y falla si algo deja de leerse.

   El corte va en 760px y no en 640: una tabla de cuatro columnas necesita ~700px
   para que sus columnas respiren, así que a 700px de pantalla ya hace falta.
   Como las reglas de ancho son `max-content` con piso de 100%, en las pantallas
   donde la tabla ya cabía no cambia nada. */

@media (max-width: 760px) {
  /* ── 1. El documento gana ancho ──────────────────────────────────────────
     24px de padding a cada lado son 48 de los 360 de un teléfono chico: el 13%
     del ancho gastado en margen. A 18 se recuperan 12px para el contenido sin
     que el texto toque el borde. */
  .doc-auditoria .doc-container {
    padding: 0 18px;
  }

  /* ── 2. Las tablas: cada una con su propio desplazamiento lateral ─────────
     `width: max-content` con `min-width: 100%` es la clave del arreglo. Antes,
     la tabla estaba obligada a caber en el ancho del teléfono y el navegador
     resolvía esa orden aplastando cada columna hasta su ancho mínimo: "todas
     las visitas de la ventana" caía en tres renglones de dos palabras. Ahora la
     tabla toma el ancho que su contenido pide (hasta el tope de abajo) y es el
     contenedor el que se desplaza. Las tablas cortas siguen ocupando el 100% y
     no se desplazan: solo se desplaza la que de verdad no cabe. */
  .doc-auditoria .tabla-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    /* La sombra que avisa que hay más tabla hacia el lado. Las dos capas
       `local` son el fondo blanco que tapa la sombra cuando ya no hay nada más
       que ver de ese lado; las dos `scroll` son la sombra en sí. Sin esto, una
       tabla que se desplaza es indistinguible de una tabla cortada. */
    background:
      linear-gradient(to right, #ffffff 30%, rgba(255, 255, 255, 0)) left center,
      linear-gradient(to left, #ffffff 30%, rgba(255, 255, 255, 0)) right center,
      radial-gradient(farthest-side at 0 50%, rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0)) left center,
      radial-gradient(farthest-side at 100% 50%, rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0)) right center;
    background-repeat: no-repeat;
    background-size: 40px 100%, 40px 100%, 14px 100%, 14px 100%;
    background-attachment: local, local, scroll, scroll;
  }

  .doc-auditoria .tabla-scroll > .res-tabla {
    display: table;
    width: max-content;
    min-width: 100%;
    font-size: 14px;
  }

  /* El tope de ancho, por número de columnas. Sin tope, una celda con una frase
     larga estira la tabla a mil y pico de píxeles y hay que desplazarse media
     hora para leer una fila; con un tope único, la tabla de cinco columnas
     queda tan apretada como estaba. El reparto da ~215px por columna en todas,
     que es donde el texto deja de partirse en renglones de dos palabras (se
     mide, no se estima: `probar-movil.mjs` cuenta renglones reales contra
     palabras y exige más de 2,2 por renglón). */
  .doc-auditoria .tabla-scroll > .res-tabla:has(thead th:nth-child(2)) {
    max-width: 460px;
  }

  .doc-auditoria .tabla-scroll > .res-tabla:has(thead th:nth-child(3)) {
    max-width: 820px;
  }

  .doc-auditoria .tabla-scroll > .res-tabla:has(thead th:nth-child(4)) {
    max-width: 880px;
  }

  .doc-auditoria .tabla-scroll > .res-tabla:has(thead th:nth-child(5)) {
    max-width: 1080px;
  }

  /* Esta lleva `table-layout: fixed` con anchos en porcentaje, así que
     `max-content` no la puede medir: se le da su ancho de diseño y sus
     porcentajes vuelven a repartir bien. */
  .doc-auditoria .tabla-scroll > .tabla-oportunidad {
    width: 880px;
    max-width: none;
  }

  /* El piso de la primera columna. El reparto automático de una tabla le da a
     cada columna un ancho proporcional a su contenido, así que la columna que
     lleva la frase larga ("Sobre qué se mide") se queda con casi todo y la
     primera —que es la que dice QUÉ fila estás leyendo— quedaba en 124px:
     "Llegan a la pantalla de pago" en tres renglones de dos palabras dentro de
     una tabla de 880px que tenía espacio de sobra. Ensanchar la tabla entera no
     lo arreglaba, porque el reparto sigue siendo proporcional.

     Por eso el piso va en TODAS las celdas y no solo en la primera: en Del
     Bosque la que se quedaba sin ancho era la última ("Qué pasa acá", 123px),
     porque ahí los nombres de producto son largos y se llevaban el reparto.
     Cuál de las columnas se queda corta depende del contenido de cada marca, o
     sea que arreglarlo columna por columna es arreglarlo para una sola. */
  .doc-auditoria .tabla-scroll > .res-tabla th,
  .doc-auditoria .tabla-scroll > .res-tabla td {
    min-width: 150px;
  }

  /* La primera lleva de qué habla la fila, y es la que se lee siempre. */
  .doc-auditoria .tabla-scroll > .res-tabla th:first-child,
  .doc-auditoria .tabla-scroll > .res-tabla td:first-child {
    min-width: 230px;
  }

  /* Una columna de cifras no necesita 150px: "2,56%" cabe en 70 y lo que sobra
     lo necesitan las columnas de texto de al lado. */
  .doc-auditoria .tabla-scroll > .res-tabla td.num:not(:first-child) {
    min-width: 96px;
  }

  /* Los encabezados de columna estaban en 11px, que con MAYÚSCULAS y
     letter-spacing es el texto más difícil de leer del documento. */
  .doc-auditoria .tabla-scroll > .res-tabla th {
    font-size: 12.5px;
    padding: 10px 12px;
  }

  .doc-auditoria .tabla-scroll > .res-tabla td {
    padding: 12px;
  }

  /* ── 3. Los gráficos, a su tamaño de diseño ──────────────────────────────
     El gráfico se dibuja en un viewBox de 720 de ancho y sus etiquetas están
     puestas en 11px de ESE espacio. Estirado al 100% de un teléfono de 390 se
     dibujaba a 320px reales, o sea que las etiquetas del eje salían a 11 ×
     320/720 = 4,9px. Eso es, literalmente, la versión de escritorio
     miniaturizada. Se le exige el ancho para el que fue dibujado y se desplaza
     dentro de su tarjeta: 11px dibujados son 11px leídos. */
  .doc-auditoria .grafico-scroll {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    background:
      linear-gradient(to right, #ffffff 30%, rgba(255, 255, 255, 0)) left center,
      linear-gradient(to left, #ffffff 30%, rgba(255, 255, 255, 0)) right center,
      radial-gradient(farthest-side at 0 50%, rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0)) left center,
      radial-gradient(farthest-side at 100% 50%, rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0)) right center;
    background-repeat: no-repeat;
    background-size: 40px 100%, 40px 100%, 14px 100%, 14px 100%;
    background-attachment: local, local, scroll, scroll;
  }

  .doc-auditoria .grafico-scroll > svg {
    min-width: 720px;
  }

  /* ── 4. Las tarjetas de cifras, a dos columnas y no a tres ───────────────
     `minmax(112px, 1fr)` metía tres columnas de 112px en un teléfono: el
     rótulo ("INGRESO POR SESIÓN") caía en tres renglones encima de una cifra
     de una línea. Con 150 de piso entran dos, que es lo que cabe. */
  .doc-auditoria .res-metrics {
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }

  .doc-auditoria .res-metric {
    padding: 13px 14px;
  }

  /* ── 5. El piso de tamaño de letra ───────────────────────────────────────
     Nada por debajo de 12,5px en un teléfono. Lo que en escritorio es un
     detalle secundario (un rótulo, una pastilla, el pie de una captura, la
     línea de base de una cifra) en un teléfono es simplemente texto que no se
     lee. Y la línea de base no es decoración: es el denominador de la cifra que
     tiene encima, o sea la parte que el documento se toma en serio.

     La única excepción es el texto DENTRO de un gráfico: ahí el `font-size` no
     es en píxeles de pantalla sino en unidades del viewBox, y como el gráfico
     se dibuja a su ancho de diseño (regla 3) sus 11px salen a 11px reales. */
  .doc-auditoria .eyebrow,
  .doc-auditoria .pill-ok,
  .doc-auditoria .pill-warn,
  .doc-auditoria .pill-neutral,
  .doc-auditoria .pill-tipo,
  .doc-auditoria .pill-fecha,
  .doc-auditoria .pill-larga,
  .doc-auditoria .evidence-title,
  .doc-auditoria .legend-note,
  .doc-auditoria .pb-label,
  .doc-auditoria .base-linea,
  .doc-auditoria .res-learn-k,
  .doc-auditoria .hyp-id,
  .doc-auditoria .fuente-name,
  .doc-auditoria .tagline-pill,
  .doc-auditoria .hero-pill,
  .doc-auditoria .logos-label,
  .doc-auditoria .res-metric .res-k,
  .doc-auditoria figcaption {
    font-size: 12.5px;
  }

  /* ── 6. Las capturas, con el ancho que hay ───────────────────────────────
     La captura es la prueba de lo que dice el hallazgo, y llega anidada tres
     tarjetas adentro: 18px del documento + 24 del cuerpo de la hipótesis + 16
     de la tarjeta del hallazgo + 12 de la figura son 70px de margen por lado,
     140 de los 390 de un teléfono. La imagen se quedaba en 244px con el texto
     de la tienda ilegible. Acá se recortan los paddings anidados y se le
     devuelve ese ancho a la imagen.

     Ojo con la tentación de escribir esto como `.doc-auditoria img`: esa regla
     tiene la misma especificidad que `.logo-row img` y, por venir después en la
     hoja, le ganaba y estiraba el logo de la cabecera de 175px a 354. La regla
     apunta a la imagen de la captura y a nada más. */
  .doc-auditoria .hyp-body {
    padding: 16px 14px 18px;
  }

  .doc-auditoria .captura-card {
    padding: 8px;
  }

  .doc-auditoria .captura-card > img {
    max-width: 100%;
  }

  /* ── 7. Lo que estaba en dos columnas, a una ─────────────────────────────
     Un bloque de dos columnas a 342px de ancho da columnas de 165: es un hilo
     vertical de palabras sueltas, no dos columnas. */
  .doc-auditoria .round-card,
  .doc-auditoria .res-head {
    flex-direction: column;
    align-items: flex-start;
  }

  .doc-auditoria .ice-bar {
    flex-wrap: wrap;
  }
}

/* El padding de la figura de una captura. Vivía como `style={{ padding: 12 }}` en
   la plantilla, donde ninguna media query lo puede alcanzar: en un teléfono esos
   12px por lado son parte de los 140 que le comían el ancho a la imagen. */
.captura-card {
  padding: 12px;
}

/* La línea de base de una cifra: sobre qué gente y de qué fuente sale. Vivía como
   `fontSize: 11.5` en línea en tres componentes de la auditoría, donde ninguna media
   query la puede alcanzar; en un teléfono 11,5px es texto que no se lee, y esta línea
   es el denominador de la cifra que tiene encima. */
.base-linea {
  font-size: 11.5px;
}


/* ── Por dónde entra el tráfico ──────────────────────────────────────────────
   El bloque que sostiene por qué la ronda trabaja donde trabaja. Va arriba del
   documento y desde el 31-ago-2026 lo que publica es la CAPTURA DEL PANEL DEL
   CLIENTE, no una tabla redibujada por nosotros (regla del COO). De ahí que aquí
   no quede ni una regla de tabla, de tarjeta de titular ni de barra: se fueron
   con lo que dibujaban. */
/* La captura del panel del cliente. Es lo único que este bloque publica en cifras desde
   el 31-ago-2026, así que tiene que leerse: encogerla al ancho de un teléfono deja el
   texto del panel en seis píxeles, que es lo mismo que no publicarla. Va en una caja con
   su propio desplazamiento lateral (nunca el de la página, L198) y con un ancho mínimo
   por debajo del cual no baja. */
.trf-captura { margin: 20px 0 0; }
.trf-captura-caja {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--n-200);
  border-radius: 12px;
}
.trf-captura img {
  display: block;
  width: 100%;
  min-width: 620px;
  border-radius: 12px;
}
.trf-captura figcaption {
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--n-500);
  line-height: 1.7;
}
/* La afordancia del deslizamiento: sin ella el lector no sabe que la imagen sigue a la
   derecha y la lee recortada creyéndola entera. Solo en pantallas donde de verdad se
   desliza. */
.trf-desliza {
  display: none;
  margin: 8px 2px 0;
  font-size: 12px;
  color: var(--n-500);
}
@media (max-width: 700px) {
  .trf-desliza { display: block; }
}

.trf-pagina { display: block; font-weight: 600; color: var(--n-900); }

.trf-cola {
  margin-top: 10px;
  font-size: 13px;
  color: var(--n-500);
  line-height: 1.7;
}

/* Las superficies que no son páginas. Van pegadas a la captura porque son su
   continuación: lo que se puede probar y ahí arriba no tiene fila. */
.trf-superficies { margin-top: 18px; }
.trf-superficies .trf-reparto-k { margin-bottom: 8px; }
.trf-reparto-k {
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--n-500);
  font-weight: 600;
}
.trf-tabla {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
.trf-tabla td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--n-100);
  vertical-align: middle;
}
.trf-tabla td.num { text-align: right; white-space: nowrap; }
.trf-tabla tbody tr:last-child td { border-bottom: 0; }
.trf-tabla-sup {
  border: 1px solid var(--n-200);
  border-radius: 12px;
  overflow: hidden;
}
.trf-sup-explica {
  display: block;
  margin-top: 2px;
  font-size: 12px;
  color: var(--n-500);
  line-height: 1.5;
}

/* La explicación de por qué la ronda trabaja donde trabaja. Se destaca del resto de las
   notas al pie porque es una respuesta, no un pie de tabla. */
.trf-nota-pagina {
  border-left: 3px solid var(--brand, #00c05f);
  padding-left: 12px;
  color: var(--n-700);
}

.trf-nota { margin-top: 20px; }

@media print {
  /* En papel no hay nada que deslizar. */
  .trf-captura-caja { overflow-x: visible; }
  .trf-captura img { min-width: 0; }
  .trf-desliza { display: none !important; }
}


/* ── Conexiones: conectar una fuente sin salir de la app ─────────────────── */
.cx-celda { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cx-mini {
  border: 0;
  background: none;
  padding: 2px 4px;
  font-size: 11.5px;
  color: var(--n-500);
  text-decoration: underline;
  cursor: pointer;
}
.cx-mini:hover { color: var(--n-900); }
.cx-mini:disabled { opacity: 0.5; cursor: default; }
.cx-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; min-width: 210px; }
.cx-form .select-input { font-size: 13px; padding: 6px 9px; }
.cx-ayuda { margin: 0; font-size: 11.5px; color: var(--n-500); line-height: 1.6; }
.cx-resultado { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; max-width: 300px; }
.cx-resultado .pill-ok, .cx-resultado .pill-warn { white-space: normal; line-height: 1.5; }
