<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  /* Fuentes de marca empaquetadas en el kit ({{KIT_URL}} lo resuelve build-pdf.mjs).
     Garantiza Geist en el PDF aunque la máquina no tenga la fuente instalada. */
  @font-face {
    font-family: "Geist";
    src: url("{{KIT_URL}}/fonts/Geist-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("{{KIT_URL}}/fonts/GeistMono-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }

  /* ConvertMate report kit — tokens de marca (extraídos de convertmate.co) */
  :root {
    --bg: #F4FAF6; --bg-raise: #E4F1E9; --card: #FFFFFF; --line: #CFE2D6;
    --ink: #2E4A3C; --ink-strong: #011611; --head: #00371D;
    --accent: #0B7A43; --accent-dim: #7FB99B;
    --bad: #A3352A; --bad-bg: #F7E3E0; --good-bg: #DDF3E6; --warn: #7A6210; --warn-bg: #F5EDD2;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4; margin: 0; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 13.5px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px 40px; }

  /* Banda de marca (siempre oscura — identidad ConvertMate) */
  .brand-band {
    background: radial-gradient(120% 180% at 50% -40%, #0a5c35 0%, #013b20 45%, #011611 100%);
    color: #CEDDD4; padding: 34px 24px 40px; margin: 0 0 34px;
  }
  .brand-band .inner { max-width: 720px; margin: 0 auto; }
  .wordmark { display: flex; align-items: center; gap: 2px; font-weight: 700; font-size: 26px; letter-spacing: -0.5px; color: #fff; }
  .eyebrow { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.18em; color: #8fd8b2; margin: 26px 0 12px; }
  h1 { font-size: 30px; line-height: 1.12; margin: 0 0 20px; font-weight: 600; letter-spacing: -0.02em; color: #fff; text-wrap: balance; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 14px; color: #a9c8b7; }
  .meta b { color: #e6f6ec; font-weight: 600; }
  .pill { display: inline-block; padding: 3px 12px; border-radius: 999px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; background: #0b3823; color: #7bedaa; border: 1px solid #1d5c3a; }

  section { margin: 0 0 34px; }
  h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; color: var(--head); margin: 0 0 6px; text-wrap: balance; break-after: avoid; }
  .kicker { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); margin: 0 0 10px; }
  p { margin: 0 0 16px; max-width: 68ch; }
  strong { color: var(--ink-strong); }
  a { color: var(--accent); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 24px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; break-inside: avoid; }
  .card .label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); opacity: 0.75; }
  .card .big { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; color: var(--ink-strong); margin: 8px 0 2px; }
  .card .sub { font-size: 14px; }
  .chip { display: inline-block; border-radius: 999px; padding: 2px 10px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.03em; }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.good { background: var(--good-bg); color: var(--accent); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .delta { color: var(--accent); font-weight: 600; font-family: var(--mono); }

  .callout { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--card); border-radius: 12px; padding: 20px 24px; margin: 20px 0; break-inside: avoid; }
  .callout p:last-child { margin-bottom: 0; }

  .tablewrap { border: 1px solid var(--line); border-radius: 14px; margin: 22px 0 6px; break-inside: avoid; overflow: hidden; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th { text-align: left; font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; color: var(--ink); opacity: 0.75; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--bg-raise); }
  td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.hot td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  td b { color: var(--ink-strong); }

  .work { display: grid; gap: 14px; margin: 22px 0; padding: 0; list-style: none; }
  .work li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; break-inside: avoid; }
  .work li b { display: block; color: var(--head); margin-bottom: 4px; }

  ol.steps { margin: 22px 0 0; padding: 0; list-style: none; counter-reset: paso; display: grid; gap: 12px; }
  ol.steps li { counter-increment: paso; display: flex; gap: 16px; align-items: baseline; break-inside: avoid; }
  ol.steps li::before { content: counter(paso); flex: 0 0 30px; height: 30px; border-radius: 999px; background: var(--good-bg); color: var(--accent); font-family: var(--mono); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }

  footer.method { border-top: 1px solid var(--line); margin-top: 30px; padding-top: 24px; font-size: 13.5px; opacity: 0.8; }
  .page-break { break-before: page; padding-top: 10px; }
</style>
</head>
<body>

<div class="brand-band">
  <div class="inner">
    <div class="wordmark" aria-label="ConvertMate">convert<svg width="20" height="26" viewBox="0 0 20 26" aria-hidden="true"><path d="M12.5 1 3 14.5h5.5L7.5 25 17 11.5h-5.5L12.5 1Z" fill="#3EE07F"/></svg>mate</div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{HEADLINE}}</h1>
    <div class="meta">{{META_HTML}}</div>
  </div>
</div>

<div class="wrap">
{{BODY_HTML}}
</div>

</body>
</html>
